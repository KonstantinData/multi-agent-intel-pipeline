id = "secret_guard_regression_gate_pre_pr"
name = "Secret Guard Regression Gate"
scope_fit = "security_pipeline"
intent = "For secret-sensitive runtime paths, enforce no regression in secret detection, redaction, and repository secret-scan policy."
owner = "liquisto/security-governance"
risk_level = "high"

[boundary]
codex_layer = true
part_of_liquisto_runtime = false
touches_app_runtime = true

[trigger]
paths = [
  "src/security/secret_guard.py",
  "src/agents/**",
  "src/research/**",
  "scripts/validate_secret_scan.py",
  "scripts/check_no_dotenv_files.py",
  ".gitleaks.toml",
]

[local_commands]
required = [
  "pytest -q tests/architecture/test_secret_guard.py",
  "pytest -q tests/test_scripts_contracts.py",
  "python scripts/check_no_dotenv_files.py",
]
conditional = [
  "detect-secrets scan . --all-files --exclude-files '(^|[\\\\/])(\\\\.git|\\\\.mypy_cache|\\\\.ruff_cache|\\\\.pytest_cache|venv|\\\\.venv|runs|reports|bom[\\\\/]sbom|bom[\\\\/]ai-bom)([\\\\/]|$)' > .secrets.scan.json",
  "python scripts/validate_secret_scan.py detect-secrets .secrets.scan.json",
]

[security_requirements]
must_hold = [
  "Secret-like payloads remain blocked before model/API calls.",
  "Error and log surfaces remain redacted (no secret value leakage).",
  "No tracked .env/.envrc secret-source bypass is introduced.",
  "Secret scan validators continue to fail on findings and pass on clean reports.",
]

[acceptance_criteria]
must_pass = [
  "All local_commands.required commands pass.",
  "Secret guard architecture tests pass with redaction guarantees.",
  "Script contract tests covering secret scan and dotenv guard pass.",
]
failure_policy = "Run automatic remediation and re-check loops until secret-guard and secret-scan regression checks pass."

[execution]
mode = "auto_fix_then_recheck"
max_auto_fix_cycles = 5
require_manual_intervention = false

[auto_remediation]
strategy = [
  "Classify failure into secret detection, redaction, dotenv guard, or scan validator category.",
  "Apply minimal fix in secret_guard or affected caller/script while preserving least-privilege behavior.",
  "Re-run failed command first, then full required suite.",
  "Repeat until acceptance criteria pass or max_auto_fix_cycles is reached.",
]
hard_blockers = [
  "Missing local tooling required for secret scanning and validation.",
  "Repository policy conflict requiring explicit governance exception.",
  "Constraints preventing required security test/script updates.",
]
escalation_rule = "Ask user only when a hard_blocker is hit; otherwise continue autonomously."

[evidence]
canonical_security_checklist = "docs/security_policy_enforcement_checklist.md"
canonical_ci_workflow = ".github/workflows/compliance-security-ai.yml"
canonical_architecture_test = "tests/architecture/test_secret_guard.py"
canonical_script_contract_test = "tests/test_scripts_contracts.py"
related_docs = [
  "README.md",
  "docs/en/security/threat-model.md",
]
