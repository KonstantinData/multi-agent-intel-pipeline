repos:
  - repo: local
    hooks:
      - id: no-main-branch-commit
        name: no-main-branch-commit
        entry: python .codex/scripts/guard_git_branch.py --hook pre-commit
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: no-main-branch-push
        name: no-main-branch-push
        entry: python .codex/scripts/guard_git_branch.py --hook pre-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: compliance-policy-check
        name: compliance-policy-check
        entry: python .codex/compliance/scripts/check_compliance_policies.py --strict --changed-only --purpose runtime_code --risk-level medium
        language: system
        stages: [pre-commit]
        files: \.(py|md|ya?ml|json|toml)$
        pass_filenames: false
