fail-on-severity: moderate
vulnerability-check: true
license-check: true
fail-on-scopes:
  - runtime
warn-only: false

# Allowlist of approved SPDX identifiers (replaces deprecated deny-licenses).
# Copyleft (GPL, LGPL, AGPL) and source-available (SSPL, BUSL) licenses are
# excluded by omission.
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - BSD-3-Clause-Clear
  - ISC
  - Unlicense
  - CC0-1.0
  - CC-BY-4.0
  - PSF-2.0
  - Python-2.0
  - HPND
  - Artistic-2.0
  - MPL-2.0
  - 0BSD

# Packages whose license metadata is absent from the GitHub dependency graph
# (PyPI reports Null). Actual licenses: ag2=Apache-2.0, filelock=Unlicense,
# keyring=MIT, pypdf=BSD-3-Clause — all permissive.
allow-dependencies-licenses:
  - pkg:pypi/ag2
  - pkg:pypi/filelock
  - pkg:pypi/keyring
  - pkg:pypi/pypdf
