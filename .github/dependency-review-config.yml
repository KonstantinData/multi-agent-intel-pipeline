# Mirrors policies/license/dependency-license-policy.json (conservative).
# Copyleft and network-copyleft licenses are denied without a documented exception.

fail-on-severity: moderate
vulnerability-check: true
license-check: true
fail-on-scopes:
  - runtime
warn-only: false

deny-licenses:
  - GPL-2.0
  - GPL-2.0-only
  - GPL-2.0-or-later
  - GPL-3.0
  - GPL-3.0-only
  - GPL-3.0-or-later
  - LGPL-2.0
  - LGPL-2.1
  - LGPL-3.0
  - AGPL-3.0
  - AGPL-3.0-only
  - AGPL-3.0-or-later
  - SSPL-1.0
  - BUSL-1.1
