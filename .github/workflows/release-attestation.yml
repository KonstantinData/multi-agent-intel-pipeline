name: release-attestation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-attestation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SYFT_IMAGE: anchore/syft@sha256:d2e42aacd6a3f602e2e94f6ef77b102852f76778a8060272c88d567fb6fedecf

jobs:
  release-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Resolve container image metadata
        id: image
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"
          primary_ref="${image_name}:sha-${short_sha}"
          {
            echo "image_name=${image_name}"
            echo "primary_ref=${primary_ref}"
            echo "short_sha=${short_sha}"
            echo "tags<<EOF"
            echo "${primary_ref}"
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${image_name}:${GITHUB_REF_NAME}"
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build OCI image
        run: |
          mapfile -t tags <<< "${{ steps.image.outputs.tags }}"
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          docker build --platform linux/amd64 "${tag_args[@]}" .
      - name: Push OCI image and resolve digest
        id: push
        run: |
          mapfile -t tags <<< "${{ steps.image.outputs.tags }}"
          for tag in "${tags[@]}"; do
            docker push "$tag"
          done
          image_digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.primary_ref }}" --format '{{.Manifest.Digest}}')"
          echo "image_digest=${image_digest}" >> "$GITHUB_OUTPUT"
      - name: Generate AI-BOM
        run: python scripts/generate_ai_bom.py --output bom/ai-bom/ai-bom.json
      - name: Validate AI-BOM
        run: python scripts/validate_ai_bom.py bom/ai-bom/ai-bom.json
      - name: Generate image SBOM with Syft
        run: |
          mkdir -p bom/sbom
          docker run --rm --platform linux/amd64 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/bom/sbom:/bom" \
            "$SYFT_IMAGE" "docker:${{ steps.image.outputs.primary_ref }}" \
            -o cyclonedx-json=/bom/sbom.json
      - name: Validate SBOM
        run: python scripts/validate_sbom.py bom/sbom/sbom.json
      - name: Attest OCI image provenance
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.image_digest }}
          push-to-registry: true
      - name: Attest OCI image SBOM
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-name: ${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.push.outputs.image_digest }}
          sbom-path: bom/sbom/sbom.json
          push-to-registry: true
      - name: Verify OCI image attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_uri="oci://${{ steps.image.outputs.image_name }}@${{ steps.push.outputs.image_digest }}"
          for attempt in {1..6}; do
            if gh attestation verify "$image_uri" -R "$GITHUB_REPOSITORY"; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              exit 1
            fi
            sleep 10
          done
          for attempt in {1..6}; do
            if gh attestation verify "$image_uri" -R "$GITHUB_REPOSITORY" --predicate-type https://cyclonedx.org/bom; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              exit 1
            fi
            sleep 10
          done
      - name: Generate release attestation
        run: >
          python scripts/generate_release_attestation.py
          --ai-bom bom/ai-bom/ai-bom.json
          --sbom bom/sbom/sbom.json
          --container-image "${{ steps.image.outputs.image_name }}"
          --image-digest "${{ steps.push.outputs.image_digest }}"
          --provenance-attested
          --sbom-attested
          --output bom/attestations/release-attestation.json
      - name: Validate release attestation schema
        run: python scripts/validate_audit_schema.py release-attestation --path bom/attestations/release-attestation.json
      - name: Upload release attestation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation
          path: |
            bom/ai-bom/ai-bom.json
            bom/sbom/sbom.json
            bom/attestations/release-attestation.json
          if-no-files-found: error
