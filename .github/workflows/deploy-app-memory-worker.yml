name: Deploy App Memory Worker (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-app-memory-worker-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: cloudflare/app-memory-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_MEMORY_DB_ID_DEV: ${{ secrets.APP_MEMORY_DB_ID_DEV }}
      APP_MEMORY_DB_ID_STAGING: ${{ secrets.APP_MEMORY_DB_ID_STAGING }}
      APP_MEMORY_DB_ID_PRODUCTION: ${{ secrets.APP_MEMORY_DB_ID_PRODUCTION }}
      APP_MEMORY_INGEST_API_TOKEN_DEV: ${{ secrets.APP_MEMORY_INGEST_API_TOKEN_DEV }}
      APP_MEMORY_INGEST_API_TOKEN_STAGING: ${{ secrets.APP_MEMORY_INGEST_API_TOKEN_STAGING }}
      APP_MEMORY_INGEST_API_TOKEN_PRODUCTION: ${{ secrets.APP_MEMORY_INGEST_API_TOKEN_PRODUCTION }}
      TARGET_ENV: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cloudflare/app-memory-worker/package-lock.json

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          case "${TARGET_ENV}" in
            dev)
              test -n "${APP_MEMORY_DB_ID_DEV}" || { echo "Missing APP_MEMORY_DB_ID_DEV" >&2; exit 1; }
              test -n "${APP_MEMORY_INGEST_API_TOKEN_DEV}" || { echo "Missing APP_MEMORY_INGEST_API_TOKEN_DEV" >&2; exit 1; }
              ;;
            staging)
              test -n "${APP_MEMORY_DB_ID_STAGING}" || { echo "Missing APP_MEMORY_DB_ID_STAGING" >&2; exit 1; }
              test -n "${APP_MEMORY_INGEST_API_TOKEN_STAGING}" || { echo "Missing APP_MEMORY_INGEST_API_TOKEN_STAGING" >&2; exit 1; }
              ;;
            production)
              test -n "${APP_MEMORY_DB_ID_PRODUCTION}" || { echo "Missing APP_MEMORY_DB_ID_PRODUCTION" >&2; exit 1; }
              test -n "${APP_MEMORY_INGEST_API_TOKEN_PRODUCTION}" || { echo "Missing APP_MEMORY_INGEST_API_TOKEN_PRODUCTION" >&2; exit 1; }
              ;;
            *)
              echo "Unsupported TARGET_ENV=${TARGET_ENV}" >&2
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Configure wrangler database_id for target environment
        run: |
          node -e '
            const fs = require("fs");
            const env = process.env.TARGET_ENV;
            const path = "wrangler.jsonc";
            const data = JSON.parse(fs.readFileSync(path, "utf8"));
            const dbIds = {
              dev: process.env.APP_MEMORY_DB_ID_DEV,
              staging: process.env.APP_MEMORY_DB_ID_STAGING,
              production: process.env.APP_MEMORY_DB_ID_PRODUCTION
            };
            data.env[env].d1_databases[0].database_id = dbIds[env];
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
          '

      - name: Run wrangler check
        run: npm run check

      - name: Apply D1 migrations
        run: |
          case "${TARGET_ENV}" in
            dev) npx wrangler d1 migrations apply liquisto-app-memory-dev --remote --env dev ;;
            staging) npm run d1:migrate:staging ;;
            production) npm run d1:migrate:prod ;;
          esac

      - name: Set INGEST_API_TOKEN secret in worker environment
        run: |
          case "${TARGET_ENV}" in
            dev)
              echo "${APP_MEMORY_INGEST_API_TOKEN_DEV}" | npx wrangler secret put INGEST_API_TOKEN --env dev
              ;;
            staging)
              echo "${APP_MEMORY_INGEST_API_TOKEN_STAGING}" | npx wrangler secret put INGEST_API_TOKEN --env staging
              ;;
            production)
              echo "${APP_MEMORY_INGEST_API_TOKEN_PRODUCTION}" | npx wrangler secret put INGEST_API_TOKEN --env production
              ;;
          esac

      - name: Deploy worker
        run: |
          case "${TARGET_ENV}" in
            dev) npx wrangler deploy --env dev ;;
            staging) npm run deploy:staging ;;
            production) npm run deploy:prod ;;
          esac
