name: scorecard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - name: Normalize SARIF categories across PR and default-branch runs
        run: |
          jq '
            def rid($r): ($r.automationDetails.id // $r.runAutomationDetails.id // "");
            if any(.runs[]?; rid(.) == "supply-chain/branch-protection") then
              .
            else
              .runs += [(
                .runs[0]
                | .automationDetails = {"id":"supply-chain/branch-protection/parity"}
                | del(.runAutomationDetails)
                | .results = []
              )]
            end
          ' scorecard-results.sarif > scorecard-results.normalized.sarif
          mv scorecard-results.normalized.sarif scorecard-results.sarif
      - name: Upload SARIF results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard-results.sarif
          if-no-files-found: error
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: scorecard-results.sarif
