name: pr-failure-digest

on:
  workflow_run:
    workflows:
      - compliance-security-ai
      - codeql
      - dependency-review
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-failure-digest-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  post-failure-digest:
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        (
          github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'cancelled' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'action_required'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Comment PR with failed checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          PR_NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this workflow run."
            exit 0
          fi

          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"
          WORKFLOW_NAME="$(jq -r '.workflow_run.name // "unknown"' "$GITHUB_EVENT_PATH")"
          CONCLUSION="$(jq -r '.workflow_run.conclusion // "unknown"' "$GITHUB_EVENT_PATH")"

          FAILED_JOBS="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq \
            '.jobs[] | select((.conclusion=="failure") or (.conclusion=="cancelled") or (.conclusion=="timed_out") or (.conclusion=="action_required")) | "- \(.name): \(.html_url)"' || true)"

          if [ -z "$FAILED_JOBS" ]; then
            FAILED_JOBS="- Keine fehlgeschlagenen Job-Details gefunden."
          fi

          COMMENT_FILE="$(mktemp)"
          {
            echo "<!-- pr-failure-digest -->"
            echo "### Automated CI Failure Digest"
            echo
            echo "- Workflow: \`$WORKFLOW_NAME\`"
            echo "- Conclusion: \`$CONCLUSION\`"
            echo "- Run: $RUN_URL"
            echo
            echo "**Failed Jobs**"
            echo "$FAILED_JOBS"
            echo
            echo "_Automatisch erstellt, damit Fixes sofort gestartet werden können._"
          } > "$COMMENT_FILE"

          EXISTING_ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq \
            '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- pr-failure-digest -->"))) | .id' | tail -n1 || true)"

          if [ -n "$EXISTING_ID" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING_ID" --method PATCH --field "body=@$COMMENT_FILE" >/dev/null
            echo "Updated failure digest comment #$EXISTING_ID on PR #$PR_NUMBER."
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --method POST --field "body=@$COMMENT_FILE" >/dev/null
            echo "Created failure digest comment on PR #$PR_NUMBER."
          fi

          rm -f "$COMMENT_FILE"
