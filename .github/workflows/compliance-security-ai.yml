name: compliance-security-ai

on:
  pull_request:
    branches:
      - "**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-security-ai-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SYFT_IMAGE: anchore/syft@sha256:d2e42aacd6a3f602e2e94f6ef77b102852f76778a8060272c88d567fb6fedecf
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:105ac66a57b2bb8afb61a3b8a5dcc4817773d03724a7e8a515214cfe58225556
  TRIVY_IMAGE: aquasec/trivy@sha256:fc10faf341a1d8fa8256c5ff1a6662ef74dd38b65034c8ce42346cf958a02d5d

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: python -m pip install --require-hashes ruff
      - name: Run Ruff
        run: ruff check src scripts tests

  type-check:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install type-check dependencies
        run: python -m pip install --require-hashes -r requirements.lock mypy pytest
      - name: Run MyPy
        run: mypy

  bandit-sast:
    needs: type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install SAST dependencies
        run: python -m pip install --require-hashes bandit
      - name: Run Bandit
        run: bandit -q -r src scripts -x tests

  dependency-lock-gate:
    needs: bandit-sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install lock tooling
        run: python -m pip install --require-hashes uv
      - name: Verify dependency lock is current
        run: |
          uv pip compile requirements.txt --python-version 3.12 --output-file requirements.lock
          git diff --exit-code requirements.lock

  dependency-vuln-gate:
    needs: dependency-lock-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --require-hashes pip-audit
      - name: Run pip-audit with CVE exception policy
        run: python scripts/run_pip_audit_with_policy.py

  secret-scan:
    needs: dependency-vuln-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install secret scanning dependencies
        run: python -m pip install --require-hashes detect-secrets
      - name: Scan for potential secrets
        run: detect-secrets scan . --all-files --exclude-files '(^|[\\/])(\\.git|\\.mypy_cache|\\.ruff_cache|\\.pytest_cache|venv|\\.venv|runs|reports|bom[\\/]sbom|bom[\\/]ai-bom)([\\/]|$)' > .secrets.scan.json
      - name: Fail on potential secrets
        run: python scripts/validate_secret_scan.py detect-secrets .secrets.scan.json
      - name: Run historical Gitleaks scan
        run: |
          set +e
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" detect \
            --source . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path .gitleaks.report.json \
            --redact
          GITLEAKS_EXIT=$?
          set -e
          if [ "$GITLEAKS_EXIT" -gt 1 ]; then
            echo "Gitleaks encountered a tool error (exit code: $GITLEAKS_EXIT)" >&2
            exit "$GITLEAKS_EXIT"
          fi
      - name: Fail on historical secrets
        run: python scripts/validate_secret_scan.py gitleaks .gitleaks.report.json

  governance-gates:
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate required governance structure
        run: python scripts/validate_audit_schema.py repository-structure
      - name: Validate main branch ruleset desired state
        run: python scripts/validate_ruleset_config.py

  policy-as-code-gate:
    needs: governance-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Generate Actions-BOM
        run: python scripts/generate_actions_bom.py --output bom/actions/actions-bom.json
      - name: Validate Actions-BOM
        run: python scripts/validate_actions_bom.py bom/actions/actions-bom.json
      - name: Upload Actions-BOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actions-bom
          path: bom/actions/actions-bom.json
          if-no-files-found: error
      - name: Run Conftest Rego unit tests
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/project" -w /project \
            openpolicyagent/conftest@sha256:97b5f4e3f964ed4a7e8e0840a16b0ac88c082fd2ca3dc5d2f999f5cd35860c38 \
            verify -p policies/rego
      - name: Run Conftest policy-as-code gate
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/project" -w /project \
            openpolicyagent/conftest@sha256:97b5f4e3f964ed4a7e8e0840a16b0ac88c082fd2ca3dc5d2f999f5cd35860c38 \
            test .github/workflows .github/rulesets -p policies/rego

  scorecard-policy-gate:
    needs: policy-as-code-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Validate local scorecard-adjacent controls
        run: python scripts/check_scorecard_policy.py

  actions-hardening-gate:
    needs: scorecard-policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate workflow hardening baseline
        run: python scripts/check_github_actions_hardening.py

  dependency-policy-gate:
    needs: actions-hardening-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Validate dependency license and registry policy
        run: python scripts/validate_dependency_policy.py

  dependency-diff-gate:
    needs: dependency-policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fetch base lockfile
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Produce dependency diff
        run: |
          git show origin/${{ github.base_ref }}:requirements.lock > /tmp/base.lock
          python scripts/dependency_diff.py /tmp/base.lock requirements.lock --output bom/actions/dependency-diff.json
      - name: Upload dependency diff artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-diff
          path: bom/actions/dependency-diff.json
          if-no-files-found: warn

  vuln-scan-gate:
    needs: dependency-policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Sync .trivyignore from CVE exception policy
        run: python scripts/generate_trivyignore.py
      - name: Trivy filesystem vulnerability scan
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/project" \
            "$TRIVY_IMAGE" fs /project \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /project/.trivyignore \
            --scanners vuln \
            --skip-dirs '.git' \
            --skip-dirs '.mypy_cache' \
            --skip-dirs '.ruff_cache' \
            --skip-dirs '.pytest_cache' \
            --skip-dirs 'bom'
      - name: Trivy Dockerfile misconfiguration scan
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/project" \
            "$TRIVY_IMAGE" config /project \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --misconfig-scanners dockerfile \
            --skip-dirs '.git' \
            --skip-dirs 'bom'

  script-contract-tests:
    needs: dependency-policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --require-hashes pytest
      - name: Run script contract tests
        run: pytest -q tests/test_scripts_contracts.py

  architecture-tests:
    needs: script-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LIQUISTO_STRICT_PROFILE_LOADING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install dependency-light test dependencies
        run: python -m pip install --require-hashes pytest pydantic filelock python-dotenv
      - name: Collect architecture tests
        run: pytest -q tests/architecture --collect-only --junitxml=reports/architecture-collect.xml
      - name: Run architecture tests
        run: pytest -q tests/architecture --junitxml=reports/architecture.xml
      - name: Upload architecture test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-test-reports
          path: reports/*.xml
          if-no-files-found: warn

  runtime-contract-tests:
    needs: architecture-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LIQUISTO_STRICT_PROFILE_LOADING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install runtime test dependencies
        run: python -m pip install --require-hashes -r requirements.lock pytest
      - name: Run readiness, golden, query, and smoke tests
        run: pytest -q tests/meeting_readiness tests/golden tests/test_query_*.py tests/smoke --junitxml=reports/runtime-contracts.xml
      - name: Upload runtime test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-contract-test-reports
          path: reports/*.xml
          if-no-files-found: warn

  integration-tests:
    needs: runtime-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock pytest
      - name: Run integration tests
        run: pytest -q -m integration --junitxml=reports/integration.xml
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-reports
          path: reports/*.xml
          if-no-files-found: warn

  ai-bom-gate:
    needs: runtime-contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Generate AI-BOM
        run: python scripts/generate_ai_bom.py --output bom/ai-bom/ai-bom.json
      - name: Validate AI-BOM
        run: python scripts/validate_ai_bom.py bom/ai-bom/ai-bom.json
      - name: Upload AI-BOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-bom
          path: bom/ai-bom/ai-bom.json
          if-no-files-found: error

  sbom-gate:
    needs: ai-bom-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Generate filesystem SBOM
        run: python scripts/generate_sbom.py --mode files --output bom/sbom/sbom.json
      - name: Validate SBOM
        run: python scripts/validate_sbom.py bom/sbom/sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: bom/sbom/sbom.json
          if-no-files-found: error

  provenance-gate:
    needs: sbom-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate compliance manifest
        run: |
          mkdir -p bom/attestations
          sha256sum .github/workflows/compliance-security-ai.yml requirements.txt requirements.lock > bom/attestations/compliance-manifest.sha256
      - name: Attest compliance manifest
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: bom/attestations/compliance-manifest.sha256
      - name: Upload compliance manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-manifest
          path: bom/attestations/compliance-manifest.sha256
          if-no-files-found: error

  pipeline-status:
    needs:
      - lint
      - type-check
      - bandit-sast
      - dependency-lock-gate
      - dependency-vuln-gate
      - secret-scan
      - governance-gates
      - actions-hardening-gate
      - script-contract-tests
      - architecture-tests
      - runtime-contract-tests
      - integration-tests
      - ai-bom-gate
      - sbom-gate
      - provenance-gate
      - policy-as-code-gate
      - scorecard-policy-gate
      - dependency-policy-gate
      - vuln-scan-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Fail if required gates failed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python scripts/check_workflow_needs_result.py
