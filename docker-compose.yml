services:
  app:
    image: ghcr.io/konstantindata/multi-agent-intel-pipeline:${LIQUISTO_IMAGE_TAG:?LIQUISTO_IMAGE_TAG is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      LIQUISTO_POSTGRES_DSN: ${LIQUISTO_POSTGRES_DSN:?LIQUISTO_POSTGRES_DSN is required}
      LIQUISTO_AUTH_POSTGRES_DSN: ${LIQUISTO_AUTH_POSTGRES_DSN:-${LIQUISTO_POSTGRES_DSN:?LIQUISTO_POSTGRES_DSN is required}}
      DATABASE_URL: ${DATABASE_URL:-${LIQUISTO_POSTGRES_DSN:?LIQUISTO_POSTGRES_DSN is required}}
      LIQUISTO_STORAGE_PROFILE: ${LIQUISTO_STORAGE_PROFILE:-production}
    volumes:
      - artifacts:/app/artifacts
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  artifacts:
