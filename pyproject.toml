[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "architecture: Pure architecture/contract tests — no AG2/autogen dependency",
    "contract: Contract validation tests — no AG2/autogen dependency",
    "integration: Integration tests — require AG2/autogen and may start agent runtimes",
    "runtime: Runtime tests — require AG2/autogen or OpenAI SDK",
    "smoke: Lightweight sanity checks",
    "security: SSRF, injection, and input-validation tests — subset of architecture",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["venv", ".git", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/orchestration/contracts.py"]

[[tool.mypy.overrides]]
module = ["autogen", "keyring"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "scripts.manual_validation.*",
    "src.agents.synthesis_department",
    "src.orchestration.speaker_selector",
    "src.memory.backfill",
]
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "src.orchestration.synthesis",
    "src.orchestration.dashboard_composer",
    "src.orchestration.runtime_guardrails",
    "src.orchestration.meeting_readiness",
    "src.orchestration.resolution_controller",
    "scripts.validate_ai_bom",
    "scripts.validate_dependency_policy",
]
warn_return_any = false
