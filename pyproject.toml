[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "architecture: Pure architecture/contract tests — no AG2/autogen dependency",
    "contract: Contract validation tests — no AG2/autogen dependency",
    "integration: Integration tests — require AG2/autogen and may start agent runtimes",
    "runtime: Runtime tests — require AG2/autogen or OpenAI SDK",
    "smoke: Lightweight sanity checks",
]
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["venv", ".git", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["arg-type", "assignment", "call-overload", "dict-item", "misc", "union-attr", "var-annotated", "attr-defined", "unused-ignore"]
files = ["src"]
